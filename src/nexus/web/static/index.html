<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexus Console</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark">✦</span>
      <span class="name">nexus</span>
      <span class="tag">console</span>
    </div>
    <div class="meta">
      <span id="version" class="pill">offline</span>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="Tools">
      <div class="nav-group" data-group="Cryptography">
        <h2>Cryptography</h2>
        <button class="nav-item active" data-tool="detect">Detect</button>
        <button class="nav-item" data-tool="decode">Decode / Magic</button>
        <button class="nav-item" data-tool="hash">Hash</button>
        <button class="nav-item" data-tool="hashid">Hash ID</button>
      </div>
      <div class="nav-group" data-group="Enumeration">
        <h2>Enumeration</h2>
        <button class="nav-item" data-tool="codeid">Code ID</button>
        <button class="nav-item" data-tool="ports">Ports</button>
      </div>
      <div class="nav-group" data-group="OSINT">
        <h2>OSINT</h2>
        <button class="nav-item" data-tool="iocs">IOC Extract</button>
        <button class="nav-item" data-tool="defang">Defang</button>
      </div>
    </nav>

    <main class="main" id="main">
      <section class="panel" id="panel">
        <!-- rendered by app.js -->
      </section>
    </main>
  </div>

  <footer class="footer">
    <span>local-first · no telemetry · all processing on this machine</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
