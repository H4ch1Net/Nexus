<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexus Console</title>
  <meta name="description" content="Offline analysis instrument: decode, hash, identify, and extract, entirely on this machine." />
  <meta name="theme-color" content="#F7F6F1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1A1A18" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    // Resolve the theme before first paint so there is no flash.
    (function () {
      var t = null;
      try { t = localStorage.getItem("nexus.theme"); } catch (e) {}
      if (t !== "paper" && t !== "carbon") {
        t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "carbon" : "paper";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <a class="skip" href="#bench">Skip to tool</a>

  <header class="topbar">
    <a class="brand" href="#detect" aria-label="Nexus home">
      <svg viewBox="0 0 38 38" aria-hidden="true" id="brand-mark"></svg>
      <span class="word">nexus</span>
      <span class="ver" id="version"></span>
    </a>
    <span class="divider" aria-hidden="true"></span>
    <div class="status" title="All processing happens on this machine">
      <span class="sq" aria-hidden="true"></span>
      <span class="label">Local · offline</span>
      <span class="code" id="origin"></span>
    </div>
    <span class="spacer"></span>
    <div class="theme-switch" role="group" aria-label="Theme">
      <button type="button" data-theme-set="paper">Paper</button>
      <button type="button" data-theme-set="carbon">Carbon</button>
    </div>
  </header>

  <div class="shell">
    <nav class="rail" id="rail" aria-label="Tools"></nav>
    <main class="bench" id="bench" tabindex="-1">
      <div class="bench-inner" id="panel"></div>
      <noscript><p>The Nexus console needs JavaScript. Every tool is also available from the <code>nexus</code> CLI.</p></noscript>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
