[build-system]
requires = ["hatchling>=1.21.1"]
build-backend = "hatchling.build"

[project]
name = "nexus-tool"
version = "0.2.0"
description = "Local-first terminal toolkit for cryptography, OSINT, logs, and enumeration"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ctf", "cryptography", "osint", "forensics", "cli", "security"]
dependencies = [
  "click>=8.1",
  "duckdb>=1.0",
  "pyarrow>=16.0",
  "pandas>=2.2",
  "pillow>=10.0"
]

[project.urls]
Homepage = "https://github.com/H4ch1Net/Nexus"
Repository = "https://github.com/H4ch1Net/Nexus"
Issues = "https://github.com/H4ch1Net/Nexus/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nexus = "nexus.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.hatch.build.targets.sdist]
include = ["src/nexus", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
